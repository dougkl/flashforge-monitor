name: build & release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, linux-arm, win-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish src/FlashforgeMonitor -c Release -r ${{ matrix.rid }} \
            --self-contained -p:PublishSingleFile=true -o out/${{ matrix.rid }}
          rm -f out/${{ matrix.rid }}/*.pdb
      - name: Package
        run: |
          cd out/${{ matrix.rid }}
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            zip -r ../../flashforge-monitor-${{ matrix.rid }}.zip .
          else
            tar -czf ../../flashforge-monitor-${{ matrix.rid }}.tar.gz .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: flashforge-monitor-${{ matrix.rid }}
          path: flashforge-monitor-${{ matrix.rid }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: flashforge-monitor-*
          generate_release_notes: true

  docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
